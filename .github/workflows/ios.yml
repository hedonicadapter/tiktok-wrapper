name: iOS

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
            if "iOS" not in rt: continue
            for dev in devs:
              if dev["name"].startswith("iPhone"):
                key=(rt, dev["name"])
                if best is None or key>best[0]: best=(key, dev["udid"])
          print(best[1] if best else "")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -i iphone | head -5

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project ScrollGate.xcodeproj \
            -scheme ScrollGate \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build.log | grep -E "error:|warning:|Test Case|Executed|BUILD|TEST" || true
          tail -5 build.log
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Unsigned IPA for sideloading (Sideloadly / AltStore / SideStore / Sideloader sign it
      # with your own Apple ID on install). No Xcode needed on the user's machine.
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild \
            -project ScrollGate.xcodeproj \
            -scheme ScrollGate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ipa.log | grep -E "error:|BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" ipa.log
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ScrollGate-unsigned.ipa Payload)
          ls -la ScrollGate-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScrollGate-unsigned-ipa
          path: ScrollGate-unsigned.ipa
